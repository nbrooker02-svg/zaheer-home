    <!-- Structured data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Zaheer Studio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Zaheer Studio is a one-person studio that builds focused AI apps for specific people and small businesses, plus Claude Code agent packs you can install and use yourself. Every app solves one specific problem really well — instead of being a bloated, $300-a-month tool built for fifty-person teams."
          }
        },
        {
          "@type": "Question",
          "name": "Who are these AI tools for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Contractors, electrical subcontractors, retail investors, solo founders, freelancers, and small businesses who don't have a budget for enterprise SaaS."
          }
        },
        {
          "@type": "Question",
          "name": "Are the apps free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PermitPilot is free to try. BackBill will be $29/month with a 14-day free trial when it launches. Market Read pricing is TBD. Every price is on the page — no contact-sales."
          }
        },
        {
          "@type": "Question",
          "name": "Can I build my own AI tools with Zaheer Studio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The Studio sells Claude Code agent packs — the same ones used to build every app on this site. The Free AI Agent Starter Kit needs no credit card. Ship Stack is $49 one-time. Studio All-Access is $19/month or $149/year for every current and future pack."
          }
        },
        {
          "@type": "Question",
          "name": "What is Claude Code?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Claude Code is Anthropic's official AI coding agent that runs in your terminal. It's free to download and runs with a Claude Pro subscription. Zaheer Studio packs are configuration layers that give Claude Code a permanent memory of your stack, your goals, and your workflow."
          }
        },
        {
          "@type": "Question",
          "name": "Where does Zaheer Studio run?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The web apps run on zaheer.studio. The agent packs run locally on your machine inside Claude Code — your data stays on your laptop. Auth via Supabase or Clerk depending on the app. Payments via Stripe."
          }
        }
      ]
    }
    </script>
